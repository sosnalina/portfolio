<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bill Pay Walkthrough — Scene 3</title>
<style>
  :root { --cursor-size: 30px; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fff;
  }
  .stage-wrap { width: 100%; }
  .stage {
    position: relative;
    width: 100%;
    overflow: hidden;
    background: #fff;
    aspect-ratio: 2036 / 1352;
  }
  .layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    user-select: none;
    pointer-events: none;
  }
  .layer-prev  { z-index: 1; }               /* scene 2's final frame — permanently covered by layer-main
                                                 below, which is opaque from the very first paint (no JS gate,
                                                 no 500ms real-run delay to wait through), so this is never
                                                 actually visible. Kept only because removing it would leave a
                                                 gap if layer-main's image ever failed to load. */
  .layer-main  { z-index: 2; }               /* visible immediately by default — not toggled via JS/500ms
                                                 real-run delay like the rest of the scene, and no fade-from-
                                                 layer-prev. The gallery already hard-cuts at the iframe level;
                                                 gating this behind the real-run delay meant layer-prev (the
                                                 previous scene's frame) was the only thing rendered for that
                                                 whole window, reading as "did it actually change?" */
  .layer-hover {
    z-index: 3;
    opacity: 0;
    transition: opacity 0.18s ease;           /* this one DOES crossfade — it's a hover state, not a scene cut */
  }
  .layer-hover.show { opacity: 1; }

  .cursor {
    position: absolute;
    width: var(--cursor-size);
    height: var(--cursor-size);
    left: 0%;
    top: 0%;
    transform: translate(-2px, -2px);
    pointer-events: none;
    z-index: 6;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.35));
  }
  .cursor svg { display: block; width: 100%; height: 100%; }

  .click-fx {
    position: absolute;
    left: 0%;
    top: 0%;
    width: 0;
    height: 0;
    pointer-events: none;
    z-index: 7;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,0.35));
  }
  .click-fx .disc {
    position: absolute;
    left: 0;
    top: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255,255,255,0.95) 0%,
      rgba(255,255,255,0.75) 40%,
      rgba(255,255,255,0.25) 72%,
      rgba(255,255,255,0) 100%);
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.02);
  }
  .click-fx.fire .disc {
    animation: discGrow 0.75s cubic-bezier(.25,.7,.3,1) forwards;
  }
  @keyframes discGrow {
    0%   { transform: translate(-50%, -50%) scale(0.05); opacity: 0; }
    18%  { opacity: 0.95; }
    55%  { transform: translate(-50%, -50%) scale(0.95); opacity: 0.85; }
    100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; }
  }

</style>
</head>

  // before reaching their internal setPos calls), so this only actually
  // affects the bare setPos(cursor, RESTING_POS...) call at the top of the
  // sequence — which needs to apply immediately, not wait for the real run
  // 500ms later, or the cursor visibly sits at the CSS default (0%, 0%) for
  // that whole window instead of its resting spot.
  function setPos(el, x, y) { el.style.left = x + '%'; el.style.top = y + '%'; }
  function getPos(el) { return { x: parseFloat(el.style.left) || 0, y: parseFloat(el.style.top) || 0 }; }
  function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }

  async function sleep(ms) {
    if (dryRun) {
      totalMs += scaled(ms);
      return;
    }
    let remaining = scaled(ms);
    const chunk = 40;
    while (remaining > 0) {
      while (paused) { await new Promise(r => setTimeout(r, chunk)); }
      await new Promise(r => setTimeout(r, Math.min(chunk, remaining)));
      remaining -= chunk;
    }
  }

  // Curved, humanized movement: instead of a straight line, each hop bows
  // slightly off-path through a randomized quadratic-bezier control point.
  // The bow direction and amount are re-rolled every call, so no two moves
  // — even to the same field on a replay — trace an identical line.
  function moveTo(pt, duration) {
    if (dryRun) {
      totalMs += scaled(duration);
      return Promise.resolve();
    }
    duration = scaled(duration);
    const start = getPos(cursor);
    const dx = pt.x - start.x, dy = pt.y - start.y;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
    const nx = -dy / dist, ny = dx / dist; // unit vector perpendicular to travel direction
    const bowMag = Math.min(dist * 0.22, 7) * (0.4 + Math.random() * 0.6);
    const bowSign = Math.random() < 0.5 ? -1 : 1;
    const midX = (start.x + pt.x) / 2 + nx * bowMag * bowSign;
    const midY = (start.y + pt.y) / 2 + ny * bowMag * bowSign;

    let elapsed = 0, last = performance.now();
    return new Promise(resolve => {
      function frame(now) {
        if (!paused) elapsed += now - last;
        last = now;
        const t = Math.min(elapsed / duration, 1);
        const eased = easeInOutCubic(t);
        const inv = 1 - eased;
        const x = inv*inv*start.x + 2*inv*eased*midX + eased*eased*pt.x;
        const y = inv*inv*start.y + 2*inv*eased*midY + eased*eased*pt.y;
        setPos(cursor, x, y);
        if (t < 1) requestAnimationFrame(frame); else resolve();
      }
      requestAnimationFrame(frame);
    });
  }

  async function fireClick(pt) {
    if (dryRun) {
      totalMs += scaled(250);
      return;
    }
    setPos(ripple, pt.x, pt.y);
    ripple.classList.remove('fire');
    void ripple.offsetWidth;
    const disc = ripple.querySelector('.disc');
    disc.style.animationDuration = scaled(750) + 'ms';
    ripple.classList.add('fire');
    await sleep(250);
  }

  // ---- Waypoints (% of 2036x1352 stage) ----
  // Carried over from scene 2's ending position — Next button in the previous modal.
  const RESTING_POS = { x: 93.00, y: 95.82 }; // matches scene 2's corrected Next button position

  // Field review order — a natural top-to-bottom, left-to-right pass over the
  // payment details, ending on the two date fields on the right.
  const REVIEW_STOPS = [
    { pt: { x: 36.39, y: 29.88 }, moveMs: 600, holdMs: 130 }, // Bank payment (ACH) toggle
    { pt: { x: 38.02, y: 43.20 }, moveMs: 350, holdMs: 120 }, // Pay to
    { pt: { x: 59.33, y: 43.34 }, moveMs: 350, holdMs: 120 }, // Email
    { pt: { x: 31.93, y: 54.22 }, moveMs: 400, holdMs: 120 }, // Vendor's ZIP code
    { pt: { x: 52.75, y: 54.29 }, moveMs: 300, holdMs: 120 }, // State
    { pt: { x: 34.14, y: 65.31 }, moveMs: 400, holdMs: 120 }, // Bank account number
    { pt: { x: 55.50, y: 65.31 }, moveMs: 350, holdMs: 120 }, // Routing number
    { pt: { x: 79.72, y: 34.02 }, moveMs: 450, holdMs: 150 }, // Withdrawal date
    { pt: { x: 77.46, y: 44.53 }, moveMs: 300, holdMs: 500 }, // Est. delivery date — final beat of the review
  ];

  const NEXT_BUTTON = { x: 93.00, y: 95.82 }; // shifted slightly left — Back button now present in footer

  async function playScene() {
    setLayer(hoverImg, 'show', false);
    cursor.style.transition = 'none';
    setPos(cursor, RESTING_POS.x, RESTING_POS.y);

    // 1. Brief beat on the new screen before the review pass begins. mainImg
    // is visible from the very first paint now (see .layer-main in <style> —
    // no opacity gate, no JS toggle, not tied to the 500ms real-run delay),
    // so there's no reveal to trigger here anymore.
    await sleep(320);

    // 2. Review pass across the form fields (~5.5s total)
    for (const stop of REVIEW_STOPS) {
      await moveTo(stop.pt, stop.moveMs);
      await sleep(stop.holdMs);
    }

    // 3. Move to Next, swap to hover state on arrival
    await moveTo(NEXT_BUTTON, 550);
    setLayer(hoverImg, 'show', true);
    await sleep(250);

    // 4. Click
    await fireClick(NEXT_BUTTON);
    await sleep(800);

  }

  window.addEventListener('load', async () => {
    dryRun = true;
    totalMs = 0;
    await playScene();
    dryRun = false;
    window.parent.postMessage({ type: 'walkthrough-duration', ms: totalMs }, window.location.origin);
    setTimeout(playScene, 500);
  });
</script>
</body>
</html>
