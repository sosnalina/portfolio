<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bill Pay Walkthrough — Scene 2</title>
<style>
  :root { --cursor-size: 30px; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fff;
  }
  .stage-wrap { width: 100%; }
  .stage {
    position: relative;
    width: 100%;
    overflow: hidden;
    background: #fff;
    aspect-ratio: 2036 / 1352;
  }
  .layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    user-select: none;
    pointer-events: none;
  }
  .layer-bg { z-index: 1; }
  .layer-modal {
    z-index: 2;
    transform: translateY(100%);
    transform-origin: center bottom;
  }
  .layer-modal.slide-up {
    animation: drawerUp 0.62s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes drawerUp {
    0%   { transform: translateY(100%) scaleY(1); }
    72%  { transform: translateY(0%)   scaleY(1); }
    86%  { transform: translateY(0%)   scaleY(1.012); }
    100% { transform: translateY(0%)   scaleY(1); }
  }
  .layer-modal-b {
    z-index: 3;
    opacity: 0;
    transition: opacity 0.18s ease;
  }
  .layer-modal-b.show { opacity: 1; }

  .cursor {
    position: absolute;
    width: var(--cursor-size);
    height: var(--cursor-size);
    left: 0%;
    top: 0%;
    transform: translate(-2px, -2px);
    pointer-events: none;
    z-index: 6;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.35));
  }
  .cursor svg { display: block; width: 100%; height: 100%; }

  .click-fx {
    position: absolute;
    left: 0%;
    top: 0%;
    width: 0;
    height: 0;
    pointer-events: none;
    z-index: 7;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,0.35));
  }
  .click-fx .disc {
    position: absolute;
    left: 0;
    top: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255,255,255,0.95) 0%,
      rgba(255,255,255,0.75) 40%,
      rgba(255,255,255,0.25) 72%,
      rgba(255,255,255,0) 100%);
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.02);
  }
  .click-fx.fire .disc {
    animation: discGrow 0.75s cubic-bezier(.25,.7,.3,1) forwards;
  }
  @keyframes discGrow {
    0%   { transform: translate(-50%, -50%) scale(0.05); opacity: 0; }
    18%  { opacity: 0.95; }
    55%  { transform: translate(-50%, -50%) scale(0.95); opacity: 0.85; }
    100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; }
  }


</style>
</head>

    <div class="cursor" id="cursor">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 2 L4 20 L8.5 16.5 L11.2 22 L14 20.6 L11.3 15.2 L17 15 Z"
              fill="white" stroke="black" stroke-width="1.2" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="click-fx" id="ripple">
      <div class="disc"></div>
    </div>
  </div>

</div>

<script>
  const cursor = document.getElementById('cursor');
  const ripple = document.getElementById('ripple');
  const modalA = document.getElementById('modalA');
  const modalB = document.getElementById('modalB');

  const SPEED = 1; // build at real pace first; tune later like scene 1
  function scaled(ms) { return ms / SPEED; }

  let paused = false;
  let dryRun = false;
  let totalMs = 0;

  // Guarded toggle for the raw modal/layer classList flips in playScene —
  // without this, dry-run's silent measurement pass would still trigger real
  // CSS transitions/animations on these elements (see Bug 2 investigation).
  function setLayer(el, cls, on) {
    if (dryRun) return;
    el.classList.toggle(cls, on);
  }

  // Not dryRun-gated: every OTHER setPos call site is already inside a
  // function with its own dryRun guard (moveTo/circleSweep/fireClick all
  // early-return before reaching their internal setPos calls), so this only
  // actually affects the bare setPos(cursor, RESTING_POS...) call at the top
  // of the sequence — which needs to apply immediately, not wait for the
  // real run 500ms later, or the cursor visibly sits at the CSS default
  // (0%, 0%) for that whole window instead of its resting spot.
  function setPos(el, x, y) { el.style.left = x + '%'; el.style.top = y + '%'; }
  function getPos(el) { return { x: parseFloat(el.style.left) || 0, y: parseFloat(el.style.top) || 0 }; }
  function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }

  async function sleep(ms) {
    if (dryRun) {
      totalMs += scaled(ms);
      return;
    }
    let remaining = scaled(ms);
    const chunk = 40;
    while (remaining > 0) {
      while (paused) { await new Promise(r => setTimeout(r, chunk)); }
      await new Promise(r => setTimeout(r, Math.min(chunk, remaining)));
      remaining -= chunk;
    }
  }

  function moveTo(pt, duration) {
    if (dryRun) {
      totalMs += scaled(duration);
      return Promise.resolve();
    }
    duration = scaled(duration);
    const start = getPos(cursor);
    let elapsed = 0, last = performance.now();
    return new Promise(resolve => {
      function frame(now) {
        if (!paused) elapsed += now - last;
        last = now;
        const t = Math.min(elapsed / duration, 1);
        const eased = easeInOutCubic(t);
        setPos(cursor, start.x + (pt.x - start.x)*eased, start.y + (pt.y - start.y)*eased);
        if (t < 1) requestAnimationFrame(frame); else resolve();
      }
      requestAnimationFrame(frame);
    });
  }

  // True round motion with a gentle organic wobble — same treatment as scene 1's
  // Bills/Unpaid tab circles, so the "read this" gesture stays visually consistent.
  function circleSweep(cx, cy, rx, ry, duration) {
    if (dryRun) {
      totalMs += scaled(duration);
      return Promise.resolve();
    }
    duration = scaled(duration);
    let elapsed = 0, last = performance.now();
    const seedA = Math.random() * Math.PI * 2;
    const seedB = Math.random() * Math.PI * 2;
    return new Promise(resolve => {
      function frame(now) {
        if (!paused) elapsed += now - last;
        last = now;
        const t = Math.min(elapsed / duration, 1);
        const eased = easeInOutCubic(t);
        const angle = -Math.PI / 2 + eased * Math.PI * 2;
        const rxJ = rx * (1 + 0.10 * Math.sin(angle * 2.3 + seedA));
        const ryJ = ry * (1 + 0.09 * Math.sin(angle * 1.7 + seedB));
        setPos(cursor, cx + Math.cos(angle) * rxJ, cy + Math.sin(angle) * ryJ);
        if (t < 1) requestAnimationFrame(frame); else resolve();
      }
      requestAnimationFrame(frame);
    });
  }

  async function fireClick(pt) {
    if (dryRun) {
      totalMs += scaled(250);
      return;
    }
    setPos(ripple, pt.x, pt.y);
    ripple.classList.remove('fire');
    void ripple.offsetWidth;
    const disc = ripple.querySelector('.disc');
    disc.style.animationDuration = scaled(750) + 'ms';
    ripple.classList.add('fire');
    await sleep(250);
  }

  // ---- Waypoints (% of 2036x1352 stage) ----
  // Cursor's resting position carried over from the end of scene 1
  // (matches SCHEDULE_PAYMENT in scene 1: cursor must not jump on scene change).
  const RESTING_POS    = { x: 91.1, y: 78.1 };
  const BILL_NO_CENTER = { x: 6.56, y: 22.00 };
  // Between the radio button and the bank icon, at the bottom text line —
  // then sweeps up-and-right across both lines like a real reading pass.
  const CARD_READ_START = { x: 35.04, y: 45.49 };
  const CARD_READ_END   = { x: 54.03, y: 42.53 };
  const NEXT_BUTTON    = { x: 93.00, y: 95.82 }; // shifted slightly left — Back button now present in footer

  async function playScene() {
    setLayer(modalA, 'slide-up', false);
    setLayer(modalB, 'show', false);
    if (!dryRun) void modalA.offsetWidth;
    cursor.style.transition = 'none';
    setPos(cursor, RESTING_POS.x, RESTING_POS.y);

    // 1. Drawer slides up from the bottom immediately — no hold at the
    // shared resting frame (scene 1's last keyframe), so the cut into this
    // scene reads as a transition, not a frozen/glitched frame. Same
    // treatment as scene 3/4's crossfade-on-cut.
    setLayer(modalA, 'slide-up', true);
    await sleep(620);
    await sleep(300);

    // 2. Circle the bill number — same treatment as scene 1's tab circles
    await moveTo(BILL_NO_CENTER, 550);
    const BILL_RX = 2.3, BILL_RY = 1.7;
    await moveTo({ x: BILL_NO_CENTER.x, y: BILL_NO_CENTER.y - BILL_RY }, 180);
    await circleSweep(BILL_NO_CENTER.x, BILL_NO_CENTER.y, BILL_RX, BILL_RY, 900);
    await sleep(250);

    // 3. Read the selected account card — land between the radio button and the
    // icon at the bottom line, then sweep across the text like someone reading it
    await moveTo(CARD_READ_START, 550);
    await moveTo(CARD_READ_END, 450);
    await sleep(400);

    // 4. Move to Next, swap to the hover-state image on arrival
    await moveTo(NEXT_BUTTON, 500);
    setLayer(modalB, 'show', true);
    await sleep(250);

    // 5. Click
    await fireClick(NEXT_BUTTON);
    await sleep(800);

  }

  window.addEventListener('load', async () => {
    dryRun = true;
    totalMs = 0;
    await playScene();
    dryRun = false;
    window.parent.postMessage({ type: 'walkthrough-duration', ms: totalMs }, window.location.origin);
    setTimeout(playScene, 500);
  });
</script>
