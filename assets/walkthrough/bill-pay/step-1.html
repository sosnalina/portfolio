<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bill Pay Walkthrough</title>
<style>
  :root {
    --cursor-size: 30px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fff;
  }
  .stage-wrap {
    width: 100%;
  }
  .stage {
    position: relative;
    width: 100%;
    overflow: hidden;
    background: #fff;
  }
  .stage img {
    display: block;
    width: 100%;
    height: auto;
    user-select: none;
    pointer-events: none;
  }
  .cursor {
    position: absolute;
    width: var(--cursor-size);
    height: var(--cursor-size);
    left: 0%;
    top: 0%;
    transform: translate(-2px, -2px);
    transition: left 0.55s cubic-bezier(.4,0,.2,1), top 0.55s cubic-bezier(.4,0,.2,1);
    pointer-events: none;
    z-index: 5;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.35));
  }
  .cursor svg { display: block; width: 100%; height: 100%; }

  .hover-underline {
    position: absolute;
    left: 87.18%;
    top: 79.15%;
    width: 8.06%;
    height: 1px;
    background: #0077C5;
    opacity: 0;
    transition: opacity 0.18s ease;
    pointer-events: none;
    z-index: 3;
  }
  .hover-underline.show {
    opacity: 1;
  }

  .click-fx {
    position: absolute;
    left: 0%;
    top: 0%;
    width: 0;
    height: 0;
    pointer-events: none;
    z-index: 4;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,0.35));
  }
  .click-fx .disc {
    position: absolute;
    left: 0;
    top: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255,255,255,0.95) 0%,
      rgba(255,255,255,0.75) 40%,
      rgba(255,255,255,0.25) 72%,
      rgba(255,255,255,0) 100%);
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.02);
  }
  .click-fx.fire .disc {
    animation: discGrow 0.75s cubic-bezier(.25,.7,.3,1) forwards;
  }
  @keyframes discGrow {
    0%   { transform: translate(-50%, -50%) scale(0.05); opacity: 0; }
    18%  { opacity: 0.95; }
    55%  { transform: translate(-50%, -50%) scale(0.95); opacity: 0.85; }
    100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; }
  }


</style>
</head>

<script>
  const cursor = document.getElementById('cursor');
  // Overall playback speed multiplier. 1 = original pace, 1.25 = 25% faster end to end.
  const SPEED = 1.25;
  function scaled(ms) { return ms / SPEED; }
  const ripple = document.getElementById('ripple');
  const hoverUnderline = document.getElementById('hoverUnderline');
  function showUnderline() { if (dryRun) return; hoverUnderline.classList.add('show'); }
  function hideUnderline() { if (dryRun) return; hoverUnderline.classList.remove('show'); }

  let paused = false;
  let dryRun = false;
  let totalMs = 0;

  // Not dryRun-gated: every OTHER setPos call site is already inside a
  // function with its own dryRun guard (moveTo/circleSweep/sweepPath/
  // fireClick all early-return before reaching their internal setPos calls),
  // so this only actually affects the bare setPos(cursor, EXPENSES_START...)
  // call at the top of the sequence — which needs to apply immediately, not
  // wait for the real run 500ms later, or the cursor visibly sits at the
  // CSS default (0%, 0%) for that whole window instead of its resting spot.
  function setPos(el, x, y) {
    el.style.left = x + '%';
    el.style.top = y + '%';
  }
  function getPos(el) {
    return {
      x: parseFloat(el.style.left) || 0,
      y: parseFloat(el.style.top) || 0
    };
  }
  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  // Pause-aware sleep: checks the paused flag in small chunks
  async function sleep(ms) {
    if (dryRun) {
      totalMs += scaled(ms);
      return;
    }
    let remaining = scaled(ms);
    const chunk = 40;
    while (remaining > 0) {
      while (paused) {
        await new Promise(r => setTimeout(r, chunk));
      }
      await new Promise(r => setTimeout(r, Math.min(chunk, remaining)));
      remaining -= chunk;
    }
  }

  // Waypoints, in % of image width/height
  const EXPENSES_START = { x: 15.42, y: 9.84 };
  const EXPENSES_END   = { x: 22.25, y: 9.84 };
  const BILLS_TAB          = { x: 34.53, y: 15.17 };
  const UNPAID_TAB        = { x: 27.41, y: 45.78 };
  const ROW3_Y             = 78.1;
  const ROW3_STOPS = [
    { x: 22.7, y: ROW3_Y }, // Vendor: AG Gardens
    { x: 29.4, y: ROW3_Y }, // Bill No: 153
    { x: 37.6, y: ROW3_Y }, // Due date
    { x: 47.3, y: ROW3_Y }, // Bill amount
    { x: 56.5, y: ROW3_Y }, // Balance due
    { x: 64.6, y: ROW3_Y }, // Approval
    { x: 73.7, y: ROW3_Y }, // Status
  ];
  const SCHEDULE_PAYMENT = { x: 91.1, y: ROW3_Y };

  // True round motion: continuous parametric ellipse, no chord segments —
  // plus a small smooth wobble so it reads as a human-drawn loop rather
  // than a perfect machine circle.
  function circleSweep(cx, cy, rx, ry, duration) {
    if (dryRun) {
      totalMs += scaled(duration);
      return Promise.resolve();
    }
    duration = scaled(duration);
    let elapsed = 0;
    let last = performance.now();
    const seedA = Math.random() * Math.PI * 2;
    const seedB = Math.random() * Math.PI * 2;
    return new Promise(resolve => {
      function frame(now) {
        if (!paused) {
          elapsed += now - last;
        }
        last = now;
        const t = Math.min(elapsed / duration, 1);
        const eased = easeInOutCubic(t);
        const angle = -Math.PI / 2 + eased * Math.PI * 2; // start at top, one full revolution
        // gentle low-frequency wobble on the radius, phase-randomized per play
        const rxJ = rx * (1 + 0.10 * Math.sin(angle * 2.3 + seedA));
        const ryJ = ry * (1 + 0.09 * Math.sin(angle * 1.7 + seedB));
        setPos(cursor, cx + Math.cos(angle) * rxJ, cy + Math.sin(angle) * ryJ);
        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          resolve();
        }
      }
      requestAnimationFrame(frame);
    });
  }

  function moveTo(pt, duration) {
    if (dryRun) {
      totalMs += scaled(duration);
      return Promise.resolve();
    }
    duration = scaled(duration);
    cursor.style.transition = 'none';
    const start = getPos(cursor);
    let elapsed = 0;
    let last = performance.now();
    return new Promise(resolve => {
      function frame(now) {
        if (!paused) {
          elapsed += now - last;
        }
        last = now;
        const t = Math.min(elapsed / duration, 1);
        const eased = easeInOutCubic(t);
        setPos(cursor, start.x + (pt.x - start.x) * eased, start.y + (pt.y - start.y) * eased);
        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          resolve();
        }
      }
      requestAnimationFrame(frame);
    });
  }

  // Moves through a list of points at one continuous, near-constant speed
  // (only the overall start/end ease — no deceleration at each waypoint).
  function sweepPath(points, duration) {
    if (dryRun) {
      totalMs += scaled(duration);
      return Promise.resolve();
    }
    duration = scaled(duration);
    const dists = [0];
    for (let i = 1; i < points.length; i++) {
      const dx = points[i].x - points[i - 1].x;
      const dy = points[i].y - points[i - 1].y;
      dists.push(dists[i - 1] + Math.sqrt(dx * dx + dy * dy));
    }
    const total = dists[dists.length - 1] || 1;
    let elapsed = 0;
    let last = performance.now();
    return new Promise(resolve => {
      function frame(now) {
        if (!paused) {
          elapsed += now - last;
        }
        last = now;
        const t = Math.min(elapsed / duration, 1);
        const eased = easeInOutCubic(t);
        const targetDist = eased * total;
        let idx = 0;
        while (idx < dists.length - 2 && dists[idx + 1] < targetDist) idx++;
        const segStart = points[idx];
        const segEnd = points[idx + 1] || points[idx];
        const segLen = (dists[idx + 1] - dists[idx]) || 1;
        const segT = Math.min(Math.max((targetDist - dists[idx]) / segLen, 0), 1);
        setPos(cursor, segStart.x + (segEnd.x - segStart.x) * segT, segStart.y + (segEnd.y - segStart.y) * segT);
        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          resolve();
        }
      }
      requestAnimationFrame(frame);
    });
  }

  async function fireClick(pt) {
    if (dryRun) {
      totalMs += scaled(250);
      return;
    }
    setPos(ripple, pt.x, pt.y);
    ripple.classList.remove('fire');
    void ripple.offsetWidth; // restart animation
    const disc = ripple.querySelector('.disc');
    disc.style.animationDuration = scaled(750) + 'ms';
    ripple.classList.add('fire');
    await sleep(250);
  }

  async function playWalkthrough() {
    hideUnderline();
    cursor.style.transition = 'none';
    setPos(cursor, EXPENSES_START.x, EXPENSES_START.y);
    await sleep(150);

    // 1. Expenses headline — quick left-to-right read, no travel wasted getting here
    await moveTo(EXPENSES_END, 350);
    await sleep(400);

    // 2. Bills tab — circulate (same treatment as the Unpaid tab)
    await sleep(150);
    await moveTo(BILLS_TAB, 600);
    const TAB_RX = 2.3, TAB_RY = 1.7;
    await moveTo({ x: BILLS_TAB.x, y: BILLS_TAB.y - TAB_RY }, 200);
    await circleSweep(BILLS_TAB.x, BILLS_TAB.y, TAB_RX, TAB_RY, 1100);
    await sleep(400);

    // 3. Unpaid tab — circulate with a smooth round path
    await sleep(150);
    await moveTo(UNPAID_TAB, 650);
    const CIRCLE_RX = 3.2, CIRCLE_RY = 2.4;
    await moveTo({ x: UNPAID_TAB.x, y: UNPAID_TAB.y - CIRCLE_RY }, 220); // ease to top of loop
    await circleSweep(UNPAID_TAB.x, UNPAID_TAB.y, CIRCLE_RX, CIRCLE_RY, 1300);
    await sleep(400);

    // 4-5. Continuous sweep across row 3 straight into Schedule payment —
    // no pause at "Due soon"; deceleration only happens at the actual endpoint.
    await sleep(150);
    await moveTo(ROW3_STOPS[0], 700);
    await sweepPath([...ROW3_STOPS, SCHEDULE_PAYMENT], 2500);
    await sleep(150);
    showUnderline();
    await sleep(200);
    await fireClick(SCHEDULE_PAYMENT);
    await sleep(500); // let the click circle finish growing while the underline is still visible
    hideUnderline();
    await sleep(500);

  }

  window.addEventListener('load', async () => {
    // Silent measurement pass: run the exact same sequence once with all
    // visual work skipped (see dryRun branches above) to get a real total
    // duration, then report it before the real, visible run starts.
    dryRun = true;
    totalMs = 0;
    await playWalkthrough();
    dryRun = false;
    window.parent.postMessage({ type: 'walkthrough-duration', ms: totalMs }, window.location.origin);
    setTimeout(playWalkthrough, 500);
  });
</script>
</body>
</html>
